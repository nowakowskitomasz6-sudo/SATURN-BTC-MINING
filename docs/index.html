
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATURN BTC MINING</title>
<style>
body {
  background: #101525;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}
h1 { color: #f5c542; }
.card {
  background: #1d2940;
  border-radius: 14px;
  padding: 18px;
  margin: 12px 0;
}
.value {
  font-size: 30px;
  font-weight: bold;
}
small { color: #b9c4d6; }
</style>
</head>
<body>
<h1>🪐 SATURN BTC MINING</h1>
<p>Panel monitoringu — tryb testowy</p>

<div class="card">
  <small>Zarejestrowani górnicy testowi</small>
  <div class="value" id="miners">—</div>
</div>

<div class="card">
  <small>Aktywne połączenia</small>
  <div class="value" id="connections">—</div>
</div>

<div class="card">
  <small>Hashrate testowy</small>
  <div class="value" id="hashrate">—</div>
</div>

<div class="card">
  <small>Wydobycie Bitcoin</small>
  <div class="value">Nieaktywne</div>
</div>

<p id="status">Oczekiwanie na dane testowe...</p>

<script>
async function refresh() {
  const status = document.getElementById("status");
  try {
    const response = await fetch(
      "./api/status.json?v=" + Date.now(),
      { cache: "no-store" }
    );
    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    document.getElementById("miners").textContent =
      data.minerCount ?? "—";

    document.getElementById("connections").textContent =
      (data.miners || []).filter(m => m.connected === true).length;

    document.getElementById("hashrate").textContent =
      data.totalHashrateTH != null
        ? data.totalHashrateTH + " TH/s"
        : "—";

    status.textContent =
      "SATURN — dane demonstracyjne. Nie są to zweryfikowane wyniki wydobycia BTC.";
  } catch (error) {
    status.textContent =
      "SATURN — brak opublikowanych danych testowych.";
  }
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
